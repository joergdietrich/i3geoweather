name: Publish to PyPI

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check tag matches package version
        run: |
          version=$(uv run --no-project python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('i3geoweather/__init__.py').read_text()).group(1))")
          test "$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          }

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
